      - testing_net
    depends_on:
      - server

  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
      - NOMBRE=Nombre4
      - APELLIDO=Apellido4
      - DOCUMENTO=10000004
      - NACIMIENTO=2000-01-01
      - NUMERO=7574
    volumes:
      - ./client/config.yaml:/config.yaml
    networks:
      - testing_net
    depends_on:
      - server

  client5:
    container_name: client5
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=5
      - NOMBRE=Nombre5
      - APELLIDO=Apellido5
      - DOCUMENTO=10000005
      - NACIMIENTO=2000-01-01
      - NUMERO=7574
